# ros2 作为 home 目录:项目挂到 /home/${USERNAME}/ros2,进入容器直接落在项目里(与 Dockerfile WORKDIR 一致)。
# 镜像用 ${IMAGE_NAME}(.env 指定)。若想省去重装,可改指向烤入了 home 数据的 ub22-ros:home(见 Dockerfile.tmp)。
# 删容器重建不丢数据:配置目录(opencode/platformIO/vscode-server)已用宿主机目录挂载持久化。
services:
  dev-interactive:
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME:-ub22_ros2}

    stdin_open: true

    tty: true

    # 使用 host 网络时 ports 会被忽略,保留以备切换 bridge 网络
    ports:
      - "127.0.0.1:8080:80"

    # security_opt:
    #   - seccomp=unconfined
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0  # 按需取消注释

    environment:
      # ---- X11 / XWayland(老程序弹窗走这条路) ----
      # 不需要 XAUTHORITY:宿主机执行 xhost +local: 后本地连接免授权
      - DISPLAY=${DISPLAY:-:0}
      # ---- Wayland(zenity 等原生弹窗走这条路) ----
      # 关键:XDG_RUNTIME_DIR 指向挂载进来的宿主目录,socket 才能被读到
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=/run/user/${UID:-1000}
      # 桌面通知(notify-send)需要宿主的 DBus 会话总线
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${UID:-1000}/bus
      # GTK/Qt 优先用 Wayland 后端,不行回退 X11
      - GDK_BACKEND=wayland,x11
      - QT_QPA_PLATFORM=wayland;xcb

    volumes:
      # X11 套接字(走 XWayland 的老程序)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Wayland socket + DBus bus 都在这里,整个挂进去
      # 注意:/run/user/<UID> 权限是 0700,要求容器内 dev 用户 UID 与宿主机一致
      - /run/user/${UID:-1000}:/run/user/${UID:-1000}:rw
      # 项目目录:挂到 home 子目录,不能盖住整个 home(否则 zsh/p10k 配置被隐藏)
      - $HOME/Documents/project/ros2:/home/${USERNAME:-dev}/ros2

      - $HOME/Documents/project/bipedal:/home/${USERNAME:-dev}/ros2/bipedal

      # vscode-server 持久化:删容器重建也不用重新下载
      - $HOME/.vscode-server-ub22:/home/${USERNAME:-dev}/.vscode-server

      # opencode 持久化(历史对话/API 密钥/模型选择都存在这里)
      - $HOME/.opencode-ub22/config:/home/${USERNAME:-dev}/.config/opencode
      - $HOME/.opencode-ub22/share:/home/${USERNAME:-dev}/.local/share/opencode
      - $HOME/.opencode-ub22/cache:/home/${USERNAME:-dev}/.cache/opencode

      # platformIO
      - $HOME/.platformio:/home/${USERNAME:-dev}/.platformio


      # zsh 配置以宿主机为准,容器内修改/删除容器都不丢
      - ../../zsh_conf/.zshrc:/home/${USERNAME:-dev}/.zshrc:rw
      - ../../zsh_conf/.p10k.zsh:/home/${USERNAME:-dev}/.p10k.zsh:rw
      
    network_mode: host
    command: ["zsh"]
